<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Matrix-Viki · 个人 AI 规则助手</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;600;700&display=swap" rel="stylesheet" />

<style>
  :root {
    --bg: #07090a;
    --bg-elev: #0d1110;
    --bg-card: #111614;
    --line: #1c2421;
    --line-strong: #2a3531;
    --ink: #e6ebe6;
    --ink-dim: #8b9690;
    --ink-mute: #5a655f;
    --green: #4ade80;
    --green-soft: #22c55e;
    --green-dim: #1a4d2e;
    --amber: #fbbf24;
    --amber-soft: #f59e0b;
    --red: #f87171;
    --blue: #60a5fa;
    --purple: #c084fc;
    --sans: 'Space Grotesk', 'Noto Sans SC', system-ui, sans-serif;
    --mono: 'JetBrains Mono', 'SF Mono', Menlo, monospace;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--sans);
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }
  body { overflow-x: hidden; }
  a { color: inherit; }
  ::selection { background: var(--green-dim); color: var(--green); }

  /* Background grid + scanline */
  .bg-grid {
    position: fixed; inset: 0; z-index: 0; pointer-events: none;
    background-image:
      linear-gradient(rgba(74,222,128,0.025) 1px, transparent 1px),
      linear-gradient(90deg, rgba(74,222,128,0.025) 1px, transparent 1px);
    background-size: 48px 48px;
    mask-image: radial-gradient(ellipse at 50% 30%, black 30%, transparent 75%);
  }
  .bg-glow {
    position: fixed; inset: 0; z-index: 0; pointer-events: none;
    background:
      radial-gradient(ellipse 60% 40% at 20% 10%, rgba(74,222,128,0.06), transparent 60%),
      radial-gradient(ellipse 50% 30% at 80% 20%, rgba(96,165,250,0.04), transparent 60%);
  }

  /* Layout */
  .shell { position: relative; z-index: 1; }
  .container {
    max-width: 1240px;
    margin: 0 auto;
    padding: 0 32px;
  }
  section { padding: 120px 0; position: relative; }
  section + section { border-top: 1px solid var(--line); }

  /* Top nav */
  .topnav {
    position: sticky; top: 0; z-index: 50;
    backdrop-filter: blur(12px);
    background: rgba(7,9,10,0.7);
    border-bottom: 1px solid var(--line);
  }
  .topnav-inner {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 32px;
    max-width: 1240px; margin: 0 auto;
  }
  .brand { display: flex; align-items: center; gap: 10px; font-family: var(--mono); font-size: 13px; letter-spacing: 0.04em; }
  .brand-mark {
    width: 22px; height: 22px;
    display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; gap: 2px;
  }
  .brand-mark span {
    background: var(--green); border-radius: 1px;
    animation: blink 2.4s ease-in-out infinite;
  }
  .brand-mark span:nth-child(2) { animation-delay: 0.3s; background: var(--green-soft); }
  .brand-mark span:nth-child(3) { animation-delay: 0.6s; background: var(--green-soft); }
  .brand-mark span:nth-child(4) { animation-delay: 0.9s; opacity: 0.4; }
  @keyframes blink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.3; }
  }
  .navlinks { display: flex; gap: 28px; font-family: var(--mono); font-size: 12px; color: var(--ink-dim); }
  .navlinks a {
    text-decoration: none; transition: color 0.2s;
    padding-bottom: 2px; border-bottom: 1px solid transparent;
  }
  .navlinks a:hover { color: var(--green); border-bottom-color: var(--green-dim); }
  .nav-status {
    font-family: var(--mono); font-size: 11px;
    display: flex; align-items: center; gap: 8px;
    color: var(--ink-dim);
  }
  .nav-status::before {
    content: ''; width: 6px; height: 6px; border-radius: 50%;
    background: var(--green); box-shadow: 0 0 8px var(--green);
    animation: pulse 2s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.5; transform: scale(0.85); }
  }

  /* Eyebrow + headings */
  .eyebrow {
    font-family: var(--mono); font-size: 11px; letter-spacing: 0.2em;
    color: var(--green); text-transform: uppercase;
    display: inline-flex; align-items: center; gap: 8px;
    padding: 6px 12px;
    border: 1px solid var(--green-dim);
    border-radius: 100px;
    background: rgba(74,222,128,0.04);
  }
  .eyebrow::before {
    content: ''; width: 5px; height: 5px; border-radius: 50%;
    background: var(--green); box-shadow: 0 0 6px var(--green);
  }
  h1, h2, h3 { font-family: var(--sans); font-weight: 600; letter-spacing: -0.02em; text-wrap: balance; }
  h1 { font-size: clamp(48px, 7vw, 96px); line-height: 0.96; margin: 32px 0 0; }
  h2 { font-size: clamp(36px, 4.5vw, 56px); line-height: 1.05; margin: 24px 0 16px; }
  h3 { font-size: 20px; line-height: 1.3; margin: 0; }
  .sub {
    font-size: 19px; line-height: 1.55; color: var(--ink-dim);
    max-width: 640px; text-wrap: pretty;
  }
  .mono { font-family: var(--mono); }
  .accent { color: var(--green); }
  .amber { color: var(--amber); }
  .blue { color: var(--blue); }
  .dim { color: var(--ink-dim); }

  /* Buttons / cards */
  .btn {
    display: inline-flex; align-items: center; gap: 10px;
    padding: 12px 20px;
    background: var(--green); color: #051208;
    border-radius: 8px; border: none; cursor: pointer;
    font-family: var(--mono); font-size: 13px; font-weight: 600;
    transition: transform 0.15s, box-shadow 0.2s;
    text-decoration: none;
  }
  .btn:hover { transform: translateY(-1px); box-shadow: 0 8px 24px rgba(74,222,128,0.25); }
  .btn-ghost {
    background: transparent; color: var(--ink);
    border: 1px solid var(--line-strong);
  }
  .btn-ghost:hover { border-color: var(--green); color: var(--green); box-shadow: none; }
  .card {
    background: var(--bg-card);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 24px;
    transition: border-color 0.2s, transform 0.2s;
  }
  .card:hover { border-color: var(--line-strong); }

  /* Terminal */
  .terminal {
    background: #060807;
    border: 1px solid var(--line);
    border-radius: 12px;
    overflow: hidden;
    font-family: var(--mono);
    font-size: 13px;
    line-height: 1.55;
    box-shadow: 0 30px 80px -20px rgba(0,0,0,0.6), 0 0 1px rgba(74,222,128,0.1);
  }
  .terminal-head {
    display: flex; align-items: center; gap: 8px;
    padding: 12px 16px;
    border-bottom: 1px solid var(--line);
    background: linear-gradient(180deg, #0a0d0c, #060807);
  }
  .term-dot { width: 11px; height: 11px; border-radius: 50%; background: #3a3a3a; }
  .term-dot.r { background: #ef4444; }
  .term-dot.y { background: #fbbf24; }
  .term-dot.g { background: #22c55e; }
  .term-title { margin-left: 12px; font-size: 11px; color: var(--ink-dim); letter-spacing: 0.05em; }
  .terminal-body { padding: 20px 22px; min-height: 200px; }
  .term-line { display: flex; gap: 10px; padding: 2px 0; }
  .term-prompt { color: var(--green); flex-shrink: 0; user-select: none; }
  .term-user { color: var(--ink); }
  .term-ai { color: var(--ink-dim); }
  .term-warn { color: var(--amber); }
  .term-deny { color: var(--red); }
  .term-info { color: var(--blue); }
  .term-comment { color: var(--ink-mute); font-style: italic; }
  .term-rule { color: var(--green); }

  /* Caret */
  .caret::after {
    content: '▊';
    color: var(--green);
    animation: caret 1s steps(2) infinite;
    margin-left: 2px;
  }
  @keyframes caret { 50% { opacity: 0; } }

  /* Utility */
  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 32px; }
  .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
  .grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; }
  @media (max-width: 900px) {
    .grid-2, .grid-3, .grid-4 { grid-template-columns: 1fr; }
    section { padding: 80px 0; }
    .container { padding: 0 20px; }
  }

  /* Section label */
  .sec-label {
    display: flex; align-items: center; gap: 16px;
    font-family: var(--mono); font-size: 11px;
    color: var(--ink-mute); letter-spacing: 0.2em;
    text-transform: uppercase;
    margin-bottom: 8px;
  }
  .sec-label::after {
    content: ''; flex: 1; height: 1px;
    background: linear-gradient(90deg, var(--line-strong), transparent);
  }

  /* Stat block */
  .stat-num {
    font-family: var(--mono); font-size: 48px; font-weight: 500;
    color: var(--green); letter-spacing: -0.04em; line-height: 1;
  }
  .stat-label { font-family: var(--mono); font-size: 12px; color: var(--ink-dim); margin-top: 8px; }

  /* Tabs */
  .tab-row { display: flex; gap: 4px; border-bottom: 1px solid var(--line); margin-bottom: 24px; }
  .tab {
    padding: 10px 16px; font-family: var(--mono); font-size: 12px;
    background: none; border: none; cursor: pointer;
    color: var(--ink-dim); border-bottom: 2px solid transparent;
    margin-bottom: -1px;
  }
  .tab.active { color: var(--green); border-bottom-color: var(--green); }
  .tab:hover:not(.active) { color: var(--ink); }

  /* Pipeline */
  .pipeline {
    display: grid;
    grid-template-columns: 220px 1fr;
    gap: 24px;
    background: var(--bg-card);
    border: 1px solid var(--line);
    border-radius: 14px;
    overflow: hidden;
  }
  .pipeline-list { padding: 12px; border-right: 1px solid var(--line); background: #090c0b; }
  .hook-item {
    display: flex; align-items: center; gap: 12px;
    padding: 12px 14px; border-radius: 8px;
    cursor: pointer; transition: background 0.15s;
    font-family: var(--mono); font-size: 12px;
    color: var(--ink-dim);
    border: 1px solid transparent;
  }
  .hook-item:hover { background: rgba(74,222,128,0.04); color: var(--ink); }
  .hook-item.active {
    background: rgba(74,222,128,0.08);
    border-color: var(--green-dim);
    color: var(--green);
  }
  .hook-num { font-size: 10px; opacity: 0.6; }
  .pipeline-detail { padding: 32px; min-height: 420px; }

  /* Maturity tiers */
  .tier-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; }
  @media (max-width: 900px) { .tier-grid { grid-template-columns: repeat(3, 1fr); } }
  .tier-card {
    background: var(--bg-card);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 18px 14px;
    cursor: pointer;
    transition: all 0.2s;
    position: relative;
    overflow: hidden;
  }
  .tier-card:hover { border-color: var(--line-strong); transform: translateY(-2px); }
  .tier-card.active { border-color: currentColor; }
  .tier-card.active::before {
    content: ''; position: absolute; inset: 0;
    background: currentColor; opacity: 0.06; pointer-events: none;
  }
  .tier-bar {
    height: 3px; border-radius: 100px;
    background: currentColor; opacity: 0.4; margin-bottom: 14px;
  }
  .tier-card.active .tier-bar { opacity: 1; box-shadow: 0 0 8px currentColor; }
  .tier-name { font-family: var(--sans); font-size: 15px; font-weight: 600; color: var(--ink); }
  .tier-meta { font-family: var(--mono); font-size: 10px; color: var(--ink-mute); margin-top: 4px; }

  /* Loop diagram */
  .loop-stage {
    background: var(--bg-card);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 32px;
    min-height: 520px;
    position: relative;
    overflow: hidden;
  }

  /* Footer */
  footer {
    padding: 60px 0 40px;
    border-top: 1px solid var(--line);
    color: var(--ink-mute);
    font-family: var(--mono); font-size: 12px;
  }
  footer a { text-decoration: none; }
  footer a:hover { color: var(--green); }

  /* Scrollbar */
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-track { background: var(--bg); }
  ::-webkit-scrollbar-thumb { background: var(--line-strong); border-radius: 100px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--green-dim); }
</style>
</head>
