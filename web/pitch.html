<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Matrix-Viki · AI 编码的记忆层</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="effects.css" />
<style>
  :root {
    --bg: #07090a;
    --bg-elev: #0d1110;
    --bg-card: #111614;
    --line: #1c2421;
    --line-strong: #2a3531;
    --ink: #e6ebe6;
    --ink-dim: #8b9690;
    --ink-mute: #5a655f;
    --green: #4ade80;
    --green-soft: #22c55e;
    --green-dim: #1a4d2e;
    --amber: #fbbf24;
    --red: #f87171;
    --blue: #60a5fa;
    --purple: #c084fc;
    --sans: 'Space Grotesk', 'Noto Sans SC', system-ui, sans-serif;
    --mono: 'JetBrains Mono', monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--ink); font-family: var(--sans); -webkit-font-smoothing: antialiased; }
  body { overflow-x: hidden; }
  ::selection { background: var(--green-dim); color: var(--green); }
  a { color: inherit; }

  .bg-grid {
    position: fixed; inset: 0; z-index: 0; pointer-events: none;
    background-image:
      linear-gradient(rgba(74,222,128,0.022) 1px, transparent 1px),
      linear-gradient(90deg, rgba(74,222,128,0.022) 1px, transparent 1px);
    background-size: 64px 64px;
    mask-image: radial-gradient(ellipse at 50% 0%, black 30%, transparent 80%);
  }
  .bg-glow {
    position: fixed; inset: 0; z-index: 0; pointer-events: none;
    background:
      radial-gradient(ellipse 60% 40% at 20% 10%, rgba(74,222,128,0.05), transparent 60%),
      radial-gradient(ellipse 50% 30% at 80% 15%, rgba(96,165,250,0.035), transparent 60%);
  }

  .shell { position: relative; z-index: 1; }
  .container { max-width: 1200px; margin: 0 auto; padding: 0 32px; }
  section { padding: 140px 0; position: relative; }
  section + section { border-top: 1px solid var(--line); }

  /* Topnav */
  .topnav {
    position: sticky; top: 0; z-index: 50;
    backdrop-filter: blur(14px);
    background: rgba(7,9,10,0.65);
    border-bottom: 1px solid var(--line);
  }
  .topnav-inner {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 32px;
    max-width: 1200px; margin: 0 auto;
  }
  .brand { display: flex; align-items: center; gap: 10px; font-family: var(--mono); font-size: 13px; letter-spacing: 0.04em; }
  .brand-mark {
    width: 22px; height: 22px;
    display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; gap: 2px;
  }
  .brand-mark span {
    background: var(--green); border-radius: 1px;
    animation: blink 2.4s ease-in-out infinite;
  }
  .brand-mark span:nth-child(2) { animation-delay: 0.3s; background: var(--green-soft); }
  .brand-mark span:nth-child(3) { animation-delay: 0.6s; background: var(--green-soft); }
  .brand-mark span:nth-child(4) { animation-delay: 0.9s; opacity: 0.4; }
  @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
  .nav-right { display: flex; gap: 14px; align-items: center; font-family: var(--mono); font-size: 11px; color: var(--ink-dim); }
  .nav-link {
    text-decoration: none; padding: 6px 12px; border-radius: 100px;
    border: 1px solid var(--line-strong); transition: all 0.15s;
  }
  .nav-link:hover { border-color: var(--green); color: var(--green); }

  /* Typography */
  h1, h2 { font-family: var(--sans); font-weight: 600; letter-spacing: -0.025em; text-wrap: balance; line-height: 0.98; margin: 0; }
  h1 { font-size: clamp(56px, 9vw, 128px); }
  h2 { font-size: clamp(40px, 5.5vw, 72px); }
  h3 { font-size: 20px; line-height: 1.3; margin: 0; font-weight: 600; }
  .eyebrow {
    font-family: var(--mono); font-size: 11px; letter-spacing: 0.22em;
    color: var(--green); text-transform: uppercase;
    display: inline-flex; align-items: center; gap: 8px;
    padding: 6px 14px; border: 1px solid var(--green-dim);
    border-radius: 100px; background: rgba(74,222,128,0.04);
  }
  .eyebrow::before {
    content: ''; width: 5px; height: 5px; border-radius: 50%;
    background: var(--green); box-shadow: 0 0 6px var(--green);
  }
  .sub { font-size: 22px; line-height: 1.5; color: var(--ink-dim); max-width: 720px; text-wrap: pretty; }
  .sub-sm { font-size: 17px; line-height: 1.55; color: var(--ink-dim); }
  .mono { font-family: var(--mono); }
  .accent { color: var(--green); }
  .amber { color: var(--amber); }
  .dim { color: var(--ink-dim); }

  .btn {
    display: inline-flex; align-items: center; gap: 10px;
    padding: 14px 24px; background: var(--green); color: #051208;
    border-radius: 100px; border: none; cursor: pointer;
    font-family: var(--mono); font-size: 13px; font-weight: 600;
    transition: transform 0.15s, box-shadow 0.2s, background 0.2s;
    text-decoration: none; letter-spacing: 0.03em;
  }
  .btn:hover { transform: translateY(-1px); box-shadow: 0 12px 32px rgba(74,222,128,0.3); }
  .btn-ghost { background: transparent; color: var(--ink); border: 1px solid var(--line-strong); }
  .btn-ghost:hover { border-color: var(--green); color: var(--green); box-shadow: none; }

  .label-sm {
    font-family: var(--mono); font-size: 11px; color: var(--ink-mute);
    letter-spacing: 0.2em; text-transform: uppercase;
  }

  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-track { background: var(--bg); }
  ::-webkit-scrollbar-thumb { background: var(--line-strong); border-radius: 100px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--green-dim); }

  footer { padding: 60px 0 40px; border-top: 1px solid var(--line); color: var(--ink-mute); font-family: var(--mono); font-size: 12px; }
  footer a { text-decoration: none; }
  footer a:hover { color: var(--green); }
</style>
</head>
<body class="scanlines">
  <div class="bg-grid"></div>
  <div class="bg-glow"></div>
  <div class="noise"></div>

  <nav class="topnav">
    <div class="topnav-inner">
      <div class="brand">
        <div class="brand-mark"><span></span><span></span><span></span><span></span></div>
        <span>MATRIX·VIKI</span>
        <span style="color:var(--ink-mute);opacity:0.5">pitch</span>
      </div>
      <div class="nav-right">
        <a href="/zh.html" class="nav-link">看技术细节 →</a>
      </div>
    </div>
  </nav>

  <div id="app" class="shell"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script type="text/babel" src="components-pitch/hero.jsx"></script>
  <script type="text/babel" src="components-pitch/problem.jsx"></script>
  <script type="text/babel" src="components-pitch/solution.jsx"></script>
  <script type="text/babel" src="components-pitch/proof.jsx"></script>
  <script type="text/babel" src="components-pitch/vision.jsx"></script>

  <script type="text/babel" src="pitch-app.jsx"></script>
  <script src="effects.js" defer></script>
</body>
</html>
